<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B2D63">
<title>羽球课表</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="羽球课表">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<style>
/* Layout: deep-blue sticky band on top, week timetable as the main surface (campus-timetable style), bottom tab bar on phones, sheets for every form.
   Palette: racket-brand green + deep court blue, lime as the small highlight. */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --surface-2:#E5EBF2; --fg:#0D1F3C; --muted:#55647B; --line:#D1DAE5; --line-soft:#E4EAF1;
  --accent:#00843D; --accent-fg:#FFFFFF; --navy:#0A3D8F; --navy-fg:#FFFFFF;
  --band:#0B2D63; --band-fg:#FFFFFF; --band-muted:rgba(255,255,255,.68); --band-hover:rgba(255,255,255,.1); --hi:#D4DE1E;
  --good:#11804A; --warn:#B06A00; --bad:#C62E2E; --scrim:rgba(6,14,30,.48);
  --c0:#1F5FBF; --c1:#D2453B; --c2:#12935A; --c3:#7B4FC9; --c4:#D9822B; --c5:#0F94A3; --c6:#C23F86; --c7:#7A8A12;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-num:"DIN Alternate","Bahnschrift","Roboto Condensed","Arial Narrow","PingFang SC",system-ui,sans-serif;
  --r:14px; --nav-h:62px; --top-h:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09121F; --surface:#101C2F; --surface-2:#17253C; --fg:#E2E9F3; --muted:#93A3B9; --line:#25354E; --line-soft:#19283F;
  --accent:#2DBE6C; --accent-fg:#03200E; --navy:#79A6F2; --navy-fg:#061A3B;
  --band:#071631; --band-fg:#E9EFF8; --band-muted:rgba(233,239,248,.62); --band-hover:rgba(255,255,255,.08); --hi:#DCE53D;
  --good:#47C584; --warn:#E5A845; --bad:#F06A62; --scrim:rgba(0,0,0,.62);
  --c0:#6F9EF0; --c1:#F07A6C; --c2:#4CCB8E; --c3:#A88BF0; --c4:#F0A85C; --c5:#4CC6D3; --c6:#EE7DB9; --c7:#B9C750;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09121F; --surface:#101C2F; --surface-2:#17253C; --fg:#E2E9F3; --muted:#93A3B9; --line:#25354E; --line-soft:#19283F;
  --accent:#2DBE6C; --accent-fg:#03200E; --navy:#79A6F2; --navy-fg:#061A3B;
  --band:#071631; --band-fg:#E9EFF8; --band-muted:rgba(233,239,248,.62); --band-hover:rgba(255,255,255,.08); --hi:#DCE53D;
  --good:#47C584; --warn:#E5A845; --bad:#F06A62; --scrim:rgba(0,0,0,.62);
  --c0:#6F9EF0; --c1:#F07A6C; --c2:#4CCB8E; --c3:#A88BF0; --c4:#F0A85C; --c5:#4CC6D3; --c6:#EE7DB9; --c7:#B9C750;
  color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
/* 手机上不缩放：关掉双击放大、横竖屏切换时的字号放大 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html{background:var(--band);color:var(--fg)}
body{background:var(--bg);color:var(--fg);min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
/* 手机全屏打开时，状态栏后面保持深蓝色，不让滚动的内容露出来 */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--band);z-index:25}
body{margin:0;font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:20px}
h3{font-size:15px}

/* top band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-fg)}
.top-in{max-width:1180px;margin:0 auto;height:var(--top-h);display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:.02em}
.brand svg{width:26px;height:26px;color:var(--hi)}
.tabs{display:none;gap:2px;margin-left:14px;align-self:stretch}
.tabs button{padding:0 16px;color:var(--band-muted);font-weight:600;border-radius:0}
.tabs button:hover{color:var(--band-fg);background:var(--band-hover)}
.tabs button[aria-current="page"]{color:var(--band-fg);box-shadow:inset 0 -3px 0 var(--hi)}
.top .sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--band-muted);white-space:nowrap;border-radius:999px;padding:4px 8px}
.sync:hover{background:var(--band-hover)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--band-muted)}
.sync.ok i{background:var(--hi)}
.sync.off i{background:#F2A93B}
.sync.err i{background:#FF6B6B}
.sync.busy i{background:var(--band-fg);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sync.busy i{animation:none}}
@media (max-width:420px){.top .sync span{display:none}}
.top .icon-btn{color:var(--band-fg)}
.top .icon-btn:hover{background:var(--band-hover)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}

.app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bnav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:600}
.bnav svg{width:22px;height:22px}
.bnav button[aria-current="page"]{color:var(--accent)}
/* 底部导航中间的“＋”：在课表页是排课、学员页是新建学员、收费页是记收款 */
.bnav .add{color:var(--accent)}
.bnav .add .plus{width:40px;height:26px;border-radius:999px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 4px 12px -5px color-mix(in oklab,var(--accent) 80%,transparent)}
.bnav .add .plus svg{width:20px;height:20px}
.btn.top-add{display:none}
/* Netlify 免费版会在右下角固定放一个“Powered by Netlify”标签（大约占底部 50px），
   出现时把导航栏和提示整体抬高，让标签待在导航栏下方的空白里 */
body.nl-badge{--badge-h:52px}
body.nl-badge .bnav{padding-bottom:max(var(--badge-h),env(safe-area-inset-bottom,0px))}
body.nl-badge .app{padding-block-end:calc(var(--nav-h) + 24px + max(var(--badge-h),env(safe-area-inset-bottom,0px)))}
body.nl-badge .toast{bottom:calc(var(--nav-h) + 16px + max(var(--badge-h),env(safe-area-inset-bottom,0px)))}
body.nl-badge .sheet{padding-bottom:calc(20px + max(var(--badge-h),env(safe-area-inset-bottom,0px)))}
@media (max-width:859px){:root{--nav-h:56px;--top-h:50px}}
@media (min-width:860px){
  body.nl-badge .app{padding-block-end:calc(24px + var(--badge-h))}
  body.nl-badge .toast{bottom:calc(28px + var(--badge-h))}
  .tabs{display:flex}
  .bnav{display:none}
  .btn.top-add{display:inline-flex;height:36px;background:var(--hi);border-color:var(--hi);color:#0B2D63}
  .top-add svg{width:18px;height:18px}
  .app{padding-block:18px 24px}
}

/* 一屏布局：打开后页面本身不上下滚动，内容按屏幕高度排好；
   屏幕实在太矮（比如小屏手机在浏览器里打开）时，才退回整页滚动 */
html.fit{padding-bottom:0;height:100%;overflow:hidden}
html.fit body{height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));min-height:0;display:flex;flex-direction:column;overflow:hidden}
html.fit .top{position:relative;top:auto;flex:none}
html.fit body .app{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding-block:10px}
html.fit .view{flex:1;min-height:0;gap:10px}
html.fit .view>*{flex:none}
html.fit .view>.grow{flex:1 1 0;min-height:var(--min-h,180px)}
html.fit .bnav{position:static;flex:none}
@media (min-width:860px){html.fit body .app{padding-block:16px 20px}html.fit .view{gap:12px}}
.col{display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* generic pieces */
.view{display:flex;flex-direction:column;gap:16px}
.bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-row .sp{flex:1}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{height:32px;padding:0 10px;font-size:13.5px;border-radius:8px}
.btn.block{width:100%;height:44px}
.btn:disabled{opacity:.6;cursor:default}
.btn svg{width:18px;height:18px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.big{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.big button{height:auto;padding:9px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;white-space:normal}
.seg.big button small{font-weight:500;font-size:12px;color:var(--muted)}
.seg.big button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:8px 10px;padding:10px 14px 6px;flex-wrap:wrap}
.panel-h .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:color-mix(in oklab,var(--good) 15%,var(--surface));color:var(--good)}
.chip.warn{background:color-mix(in oklab,var(--warn) 16%,var(--surface));color:var(--warn)}
.chip.bad{background:color-mix(in oklab,var(--bad) 14%,var(--surface));color:var(--bad)}
.chip.acc{background:color-mix(in oklab,var(--accent) 14%,var(--surface));color:var(--accent)}
.chip.navy{background:color-mix(in oklab,var(--navy) 14%,var(--surface));color:var(--navy)}
.chip svg{width:12px;height:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:6px;font-size:17px}
.empty .bar-row{justify-content:center;margin-top:14px}
.banner{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:6px 8px 6px 12px;border-radius:12px;background:color-mix(in oklab,var(--hi) 22%,var(--surface));color:var(--fg);font-size:12.5px;line-height:1.4}
.banner .btn.sm{height:28px}
.banner .sp{flex:1}
.c0{--cc:var(--c0)}.c1{--cc:var(--c1)}.c2{--cc:var(--c2)}.c3{--cc:var(--c3)}.c4{--cc:var(--c4)}.c5{--cc:var(--c5)}.c6{--cc:var(--c6)}.c7{--cc:var(--c7)}

/* 今日点名 + 明天（课表页顶部） */
.tdy{display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.tdy>div{padding:8px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.soon-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:24px}
.soon-h .sp{flex:1}
.soon-h small{font-weight:500;color:var(--muted);font-size:12.5px}
.soon-h .num{font-size:14px;color:var(--muted);font-weight:600}
.soon-h .num.warn{color:var(--warn)}
.soon-i{display:flex;align-items:center;gap:10px;font-size:14px;text-align:left;width:100%;min-width:0;padding:3px 0}
.soon-i .num{font-size:15px;width:44px;flex:none;font-weight:600}
.soon-i span:last-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.soon-i b{color:var(--fg)}
.tdy .none{color:var(--muted);font-size:13.5px}
.tdy .tmr .soon-h{color:var(--navy)}
.tdy .tmr-full{display:none}
/* 手机上“明天”压成一行，点一下看提醒设置 */
.tmr-line{display:flex;align-items:center;gap:6px;width:100%;text-align:left;font-size:13px;color:var(--muted);min-width:0;min-height:26px}
.tmr-line svg{width:14px;height:14px;flex:none;color:var(--navy)}
.tmr-line b{color:var(--navy);flex:none}
.tmr-line span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmr-line i{font-style:normal;flex:none;color:var(--navy);font-weight:600;font-size:12.5px}
.tdy>.tmr{border-top:1px solid var(--line-soft);padding-block:5px}
@media (min-width:860px){
  .tdy{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tdy>.tmr{border-top:0;border-left:1px solid var(--line-soft);padding-block:8px}
  .tdy .tmr-full{display:flex;flex-direction:column;gap:2px}
  .tdy .tmr-line{display:none}
}
/* 历史未点名：一行提示条，点开在弹窗里逐个点名 */
.odbar{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 12px;border-radius:12px;font-size:13.5px;
  background:color-mix(in oklab,var(--warn) 13%,var(--surface));border:1px solid color-mix(in oklab,var(--warn) 40%,var(--line));color:var(--fg)}
.odbar svg{width:16px;height:16px;flex:none;color:var(--warn)}
.odbar b{color:var(--warn)}
.odbar .sp{flex:1}
.odbar small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.odbar i{font-style:normal;font-weight:700;color:var(--warn);white-space:nowrap}

/* week header */
.wk-nav{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.wk-title{display:flex;flex-direction:column;line-height:1.15;min-width:0;padding:0 4px}
.wk-title b{font-family:var(--font-num);font-size:22px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
button.wk-title{text-align:left;border-radius:8px}
button.wk-title small{color:var(--accent);font-weight:600}
@media (max-width:420px){.wk-title b{font-size:19px}.wk-nav{gap:2px}.wk-nav .icon-btn{width:34px}}
.wk-title small{font-size:12px;color:var(--muted)}
.wk-nav .sp{flex:1}

/* timetable */
.tt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:clip;display:flex;flex-direction:column}
.tt-body{flex:1;min-height:0}
.tt-row{display:grid;grid-template-columns:38px repeat(7,minmax(0,1fr))}
.tt-days{z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tt-day{display:flex;flex-direction:column;align-items:center;padding:5px 0 4px;gap:0;font-size:12px;color:var(--muted);border-left:1px solid var(--line-soft)}
.tt-day b{font-family:var(--font-num);font-size:17px;font-weight:600;color:var(--fg);line-height:1.1;min-width:28px;text-align:center;border-radius:8px;padding:1px 4px}
.tt-day.today{color:var(--accent);font-weight:700}
.tt-day.today b{background:var(--accent);color:var(--accent-fg)}
.tt-day.tmr b{box-shadow:inset 0 0 0 1.5px var(--navy)}
.tt-day.weekend{background:color-mix(in oklab,var(--surface-2) 45%,transparent)}
.tt-axis{position:relative}
.tt-axis span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--font-num);font-size:12.5px;color:var(--muted)}
.tt-col{position:relative;border-left:1px solid var(--line-soft);cursor:cell;
  background-image:linear-gradient(to bottom,var(--line-soft) 1px,transparent 1px);background-size:100% calc(100% / var(--rows))}
.tt-col.weekend{background-color:color-mix(in oklab,var(--surface-2) 45%,transparent)}
.tt-col.today{background-color:color-mix(in oklab,var(--accent) 6%,transparent)}
.lz{position:absolute;margin:1px 2px;border-radius:7px;padding:3px 4px;font-size:12px;line-height:1.2;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:0;min-height:18px;container-type:size;
  background:color-mix(in oklab,var(--cc) 19%,var(--surface));border:1px solid color-mix(in oklab,var(--cc) 42%,transparent);color:var(--fg);cursor:pointer}
.lz:hover{background:color-mix(in oklab,var(--cc) 30%,var(--surface))}
.lz b{font-weight:700;color:color-mix(in oklab,var(--cc) 62%,var(--fg));word-break:break-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.lz .t{font-family:var(--font-num);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:2px}
.lz .t svg{width:11px;height:11px;flex:none;color:color-mix(in oklab,var(--cc) 70%,var(--fg))}
.lz .t{white-space:nowrap}
.lz .v{color:var(--muted);font-size:11px;word-break:break-all}
.lz.single{border-style:dashed;border-width:1.5px}
.lz.done{background:color-mix(in oklab,var(--cc) 10%,var(--surface))}
.lz.done b{color:color-mix(in oklab,var(--cc) 45%,var(--muted))}
.lz.cancelled{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--surface-2) 6px 12px);border-style:dashed;border-color:var(--line)}
.lz.cancelled b{color:var(--muted);text-decoration:line-through}
.lz .flag{position:absolute;right:3px;top:3px;width:13px;height:13px;color:var(--good)}
/* 课块很矮时（屏幕小、课时短）只留名字 */
@container (max-height:30px){.lz .t{display:none}}
@container (max-height:50px){.lz .v{display:none}}
.lz.absent .flag{color:var(--bad)}
.lz.pending{border:1.5px dashed var(--warn)}
.lz.pending .flag{color:var(--warn)}
.lz.free .flag{color:var(--navy)}
/* 点名 */

/* ---------- supabase (plain REST, no SDK) ---------- */
class ApiError extends Error{constructor(status,body,net){super('');this.status=status;this.body=body||{};this.net=!!net;}}
async function http(method,url,o){
  o=o||{};
  const h=Object.assign({apikey:CFG.key},o.headers||{});
  if(o.body!==undefined)h['Content-Type']='application/json';
  if(o.auth)h.Authorization='Bearer '+o.auth;
  let r;
  try{r=await fetch(url,{method,headers:h,body:o.body===undefined?undefined:JSON.stringify(o.body)});}
  catch(e){throw new ApiError(0,null,true);}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok)throw new ApiError(r.status,j);
  return j;
}
const authPost=(path,body,tok)=>http('POST',CFG.url+'/auth/v1/'+path,{body,auth:tok});
function setSession(j){
  session={access_token:j.access_token,refresh_token:j.refresh_token,
    expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),
    user:{id:j.user.id,email:j.user.email}};
  lsSet(SESS_KEY,JSON.stringify(session));
}
let refreshing=null;
function refresh(){
  if(!refreshing)refreshing=(async()=>{
    try{setSession(await authPost('token?grant_type=refresh_token',{refresh_token:session.refresh_token}));}
    catch(e){if(!e.net){expire();e.expired=true;}throw e;}
    finally{refreshing=null;}
  })();
  return refreshing;
}
async function token(){
  if(session.expires_at*1000-Date.now()<60000){
    try{await refresh();}catch(e){if(e.expired)throw e;}
  }
  return session.access_token;
}
async function rest(method,path,o){
  const t=await token();
  try{return await http(method,CFG.url+'/rest/v1/'+path,Object.assign({},o,{auth:t}));}
  catch(e){
    if(e.status===401&&!e.net){await refresh();return await http(method,CFG.url+'/rest/v1/'+path,Object.assign({},o,{auth:session.access_token}));}
    throw e;
  }
}
function apiMsg(e){
  if(!e)return '出错了，请再试一次';
  if(e.net)return '连不上云端，请检查网络后再试';
  const b=e.body||{},code=b.error_code||b.code||'',m=String(b.msg||b.message||b.error_description||b.error||'');
  const map={invalid_credentials:'邮箱或密码不对',user_already_exists:'这个邮箱已经注册过了，请直接登录',email_exists:'这个邮箱已经注册过了，请直接登录',
    email_not_confirmed:'邮箱还没确认，请先去邮箱点确认链接',weak_password:'密码太简单了，至少 6 位',over_email_send_rate_limit:'发邮件太频繁了，请过一会儿再试',
    over_request_rate_limit:'操作太频繁了，请过一会儿再试',signup_disabled:'云端关闭了注册，请联系管理员',email_address_invalid:'邮箱格式不对',validation_failed:'邮箱或密码格式不对',
    PGRST205:'云端还没建好数据表，请按《云端配置步骤》运行那段 SQL',PGRST301:'登录已失效，请重新登录','42501':'云端拒绝了这次保存（权限设置不对），请检查 SQL 里的权限部分',
    '23514':'云端数据表是旧版本，请按《云端配置步骤》第 2 步重新运行一次 SQL'};
  if(map[code])return map[code];
  if(/Invalid login/i.test(m))return map.invalid_credentials;
  if(/already registered/i.test(m))return map.user_already_exists;
  if(/Email not confirmed/i.test(m))return map.email_not_confirmed;
  if(/Password should/i.test(m))return map.weak_password;
  if(/Invalid API key|No API key|apikey/i.test(m))return '云端密钥不对，请检查配置';
  if(/schema cache|does not exist/i.test(m))return map.PGRST205;
  if(/check constraint/i.test(m))return map['23514'];
  return m?'云端返回：'+m:`出错了（${e.status}），请再试一次`;
}

/* ---------- sync ---------- */
function setSync(st,msg){
  const changed=store.sync!==st||store.syncMsg!==(msg||'');
  store.sync=st;store.syncMsg=msg||'';renderSync();
  if(changed&&st==='err')toast(msg);
}
function handleSyncErr(e){
  if(e&&e.expired)return;
  if(e&&e.net){setSync('off');retryLater();return;}
  setSync('err',apiMsg(e));retryLater();
}
let retryT=0,flushT=0,flushing=false;
function retryLater(){clearTimeout(retryT);retryT=setTimeout(()=>{store.pulled?flush():pull();},20000);}
function flushSoon(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms==null?400:ms);}
async function flush(){
  if(!session||store.mode!=='app')return;
  if(flushing)return;
  if(!outbox.size){if(store.pulled)setSync('ok');return;}
  flushing=true;setSync('busy');
  const snap=[...outbox.entries()];
  try{
    const puts=[],dels={},now=new Date().toISOString();
    snap.forEach(([key])=>{const [k,id]=splitKey(key);const o=S[k]&&S[k].get(id);
      if(o)puts.push({user_id:session.user.id,kind:k,id,data:clean(o),updated_at:now});else (dels[k]=dels[k]||[]).push(id);});
    for(let i=0;i<puts.length;i+=400)
      await rest('POST','records?on_conflict=user_id,kind,id',{headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:puts.slice(i,i+400)});
    for(const k of Object.keys(dels))for(let i=0;i<dels[k].length;i+=60){
      const list=dels[k].slice(i,i+60).map(x=>'"'+String(x).replace(/["\\]/g,m=>'\\'+m)+'"').join(',');
      await rest('DELETE',`records?kind=eq.${k}&id=in.(${encodeURIComponent(list)})`,{headers:{Prefer:'return=minimal'}});
    }
    snap.forEach(([key,s])=>{if(outbox.get(key)===s)outbox.delete(key);});
    saveOutbox();flushing=false;
    if(outbox.size)return flush();
    setSync('ok');
  }catch(e){flushing=false;handleSyncErr(e);}
}
async function pull(){
  if(!session||store.mode!=='app')return;
  setSync('busy');
  try{
    const rows=[];
    for(let off=0;;off+=1000){
      const page=await rest('GET',`records?select=kind,id,data&order=kind.asc,id.asc&limit=1000&offset=${off}`)||[];
      rows.push(...page);if(page.length<1000)break;
    }
    if(store.mode!=='app')return;
    const N={};KINDS.forEach(k=>N[k]=new Map());
    rows.forEach(r=>{if(N[r.kind]&&r.data)N[r.kind].set(r.id,Object.assign({},r.data,{id:r.id}));});
    outbox.forEach((_,key)=>{const [k,id]=splitKey(key);if(!N[k])return;const lo=S[k].get(id);lo?N[k].set(id,lo):N[k].delete(id);});
    KINDS.forEach(k=>S[k]=N[k]);
    store.pulled=true;store.lastPull=Date.now();saveCache();scheduleRender();
    if(outbox.size)await flush();else setSync('ok');
  }catch(e){handleSyncErr(e);if(!store.pulled)scheduleRender();}
}
function commit(ops){
  ops.forEach(([op,k,o])=>{
    if(op==='put'){S[k].set(o.id,o);outbox.set(k+'|'+o.id,++seq);}
    else{S[k].delete(o);outbox.set(k+'|'+o,++seq);}
  });
  saveCache();saveOutbox();scheduleRender();flushSoon();
}
const put=(k,o)=>commit([['put',k,o]]);

/* ---------- domain ---------- */
const clientsArr=(all)=>[...S.clients.values()].filter(c=>all||!c.archived).sort((a,b)=>((a.type==='org')-(b.type==='org'))||String(a.name).localeCompare(String(b.name),'zh'));
const client=id=>S.clients.get(id);
const cName=id=>(client(id)||{}).name||'已删除';
const sName=id=>{const n=cName(id).replace(/^示例·/,'').replace(/（[^）]*）|\([^)]*\)/g,'').trim();return n||cName(id);};
const cColor=id=>{const c=client(id);return c?(c.color||0)%8:7;};
const lessonEndTs=l=>parseYmd(l.date).getTime()+toMin(l.end)*60000;
// 点名功能从这一天开始：之前的课不用补点名，过了时间就当作“已上”；从这天起的课，点了名才计费、扣课时
const ROLLCALL_SINCE='2026-10-19';
const marked=l=>['attended','absent','cancelled','free'].includes(l.status);
const lstate=l=>{
  const st=l.status;
  if(st==='cancelled')return 'cancelled';
  if(st==='absent')return 'absent';
  if(st==='free')return 'free';
  if(st==='attended')return 'done';
  if(lessonEndTs(l)>Date.now())return 'upcoming';
  return l.date<ROLLCALL_SINCE?'done':'pending';
};
const pendingLessons=()=>lessons().filter(l=>lstate(l)==='pending').sort(byTime);
const charged=l=>{const s=lstate(l);return s==='done'||s==='absent';};
const dur=l=>Math.max(0,(toMin(l.end)-toMin(l.start))/60);
const byTime=(a,b)=>(a.date+a.start).localeCompare(b.date+b.start);
const lessons=()=>[...S.lessons.values()];
const payments=()=>[...S.payments.values()];
const histories=()=>[...S.history.values()];
const isFixed=l=>!!l.seriesId;
// 按节收费：资料里填了“一节课多长”，就按上课时长自动折算节数；没填就跟以前一样，每次课算 1 节
const PARTIAL={exact:'按实际比例算',halfDown:'不足半节不算',halfRound:'按半节四舍五入',wholeDown:'只算整节'};
const byUnit=c=>!!c&&c.rateUnit!=='hour';
const unitMin=c=>byUnit(c)&&+c.unitMin>0?+c.unitMin:0;
const nTxt=n=>String(Math.round((+n||0)*100)/100);
const lu=l=>l&&l.units!=null&&!isNaN(+l.units)?+l.units:1;   // 一条课程记录算几节（旧记录没有这个字段，算 1 节）
function roundUnits(x,rule){
  if(rule==='halfDown')return Math.floor(x*2+1e-9)/2;
  if(rule==='halfRound')return Math.round(x*2)/2;
  if(rule==='wholeDown')return Math.floor(x+1e-9);
  return Math.round(x*1e6)/1e6;   // 按实际比例：内部保留精确值，显示时取 2 位小数
}
function calcUnits(c,start,end){
  const um=unitMin(c);if(!um)return 1;
  return Math.max(0,roundUnits((toMin(end)-toMin(start))/um,c.partial));
}
function calcFee(c,start,end,units){
  if(!c)return 0;
  if(!byUnit(c))return r2((+c.rate||0)*(toMin(end)-toMin(start))/60);
  if(units!=null)return r2((+c.rate||0)*units);
  const um=unitMin(c);if(!um)return r2(+c.rate||0);
  const x=(toMin(end)-toMin(start))/um;
  return r2((+c.rate||0)*(c.partial&&c.partial!=='exact'?roundUnits(x,c.partial):x));
}
function rateTxt(c){return c.rate?`${money(c.rate)}/${c.rateUnit==='hour'?'小时':'节'}${unitMin(c)?`（一节 ${nTxt(unitMin(c)/60)} 小时）`:''}`:'未设课费';}
function summary(c){
  const ls=lessons().filter(l=>l.clientId===c.id);
  const ps=payments().filter(p=>p.clientId===c.id);
  const hs=histories().filter(h=>h.clientId===c.id);
  const ch=ls.filter(charged);
  const hisN=sum(hs,h=>h.count),hisFee=sum(hs,h=>h.fee),hisPaid=sum(hs,h=>h.paid),hisH=sum(hs,h=>h.hours);
  const due=sum(ch,l=>l.fee)+hisFee, paid=sum(ps,p=>p.amount)+hisPaid;
  const pk=ps.filter(p=>+p.lessons>0);let remain=null;
  if(pk.length){const first=pk.map(p=>p.date).sort()[0];remain=r2(sum(pk,p=>p.lessons)-sum(ch.filter(l=>l.date>=first),lu));}
  const up=ls.filter(l=>lstate(l)==='upcoming').sort(byTime);
  const ym=ymOf(new Date());
  const firstYm=[...ch.map(l=>l.date.slice(0,7)),...hs.map(h=>h.ym)].sort()[0]||null;
  const lastDone=ch.slice().sort(byTime).pop();
  return {ls,ps,hs,due,paid,balance:r2(paid-due),remain,next:up[0],upN:up.length,hrs:sum(ch,dur)+hisH,count:r2(sum(ch,lu)+hisN),hisN,
    monthCount:r2(sum(ch.filter(l=>l.date.startsWith(ym)),lu)),firstYm,lastDone};
}
function conflicts(date,start,end,ignore){
  const s=toMin(start),e=toMin(end);
  return lessons().filter(l=>l.date===date&&l.status!=='cancelled'&&!ignore.has(l.id)&&toMin(l.start)<e&&toMin(l.end)>s);
}
function seriesList(clientId){
  const g={};
  lessons().forEach(l=>{if(l.seriesId&&(!clientId||l.clientId===clientId))(g[l.seriesId]=g[l.seriesId]||[]).push(l);});
  return Object.entries(g).map(([sid,ls])=>{
    ls.sort(byTime);
    const wds=[...new Set(ls.map(l=>wdIdx(l.date)))].sort();
    const last=ls[ls.length-1];
    return {sid,ls,wds,first:ls[0],last,up:ls.filter(l=>lstate(l)==='upcoming'),done:ls.filter(charged),clientId:last.clientId};
  }).sort((a,b)=>(b.up.length>0)-(a.up.length>0)||b.last.date.localeCompare(a.last.date));
}
// 按“YYYY”或“YYYY-MM”前缀汇总一段时间
function periodData(prefix){
  const ls=lessons().filter(l=>l.date.startsWith(prefix));

    hrs:sum(ch,dur)+sum(hs,h=>h.hours),count:r2(sum(ch,lu)+sum(hs,h=>h.count)),sessions:ch.length,
    pri:sum(ch.filter(l=>!isOrg(l.clientId)),l=>l.fee)+sum(hs.filter(h=>!isOrg(h.clientId)),h=>h.fee),
    org:sum(ch.filter(l=>isOrg(l.clientId)),l=>l.fee)+sum(hs.filter(h=>isOrg(h.clientId)),h=>h.fee),
    upFee:sum(up,l=>l.fee),upN:up.length,cancel:ls.filter(l=>l.status==='cancelled').length,pend:ls.filter(l=>lstate(l)==='pending').length,
    received:sum(payments().filter(p=>p.date.startsWith(prefix)),p=>p.amount)+sum(hs,h=>h.paid)};

// 课表显示的时间范围：按前后几周实际上课的时间来定（至少 8 个小时），让课表在一屏里放得下、格子尽量大
function hourRange(ws,ls){
  const from=ymd(addDays(ws,-28)),to=ymd(addDays(ws,34));
  const near=lessons().filter(l=>l.status!=='cancelled'&&l.date>=from&&l.date<=to).concat(ls);
  let sH=24,eH=0;
  near.forEach(l=>{sH=Math.min(sH,Math.floor(toMin(l.start)/60));eH=Math.max(eH,Math.ceil(toMin(l.end)/60));});
  if(sH>=eH){sH=8;eH=22;}
  while(eH-sH<8){if(eH<24)eH++;if(eH-sH<8&&sH>0)sH--;}
  return [sH,eH];
}
function viewWeek(){

  </div>`;
  if(!S.clients.size)return out+emptyStart();
  const fixedN=live.filter(isFixed).length;
  const sumHtml=`<div class="wk-sum"><span><b>${live.length}</b>次课</span><span><b>${nTxt(sum(live,lu))}</b>节</span><span class="xs"><b>${fixedN}</b>固定 · <b>${live.length-fixedN}</b>单次</span><span><b>${hrsTxt(sum(live,dur))}</b>小时</span><span><b>${short(sum(live,l=>l.fee))}</b>元</span><span><b>${doneN}</b>已上</span></div>`;
  if(ui.mode==='list'){
    let body='';

      const dl=ls.filter(l=>l.date===ds[i]).sort(byTime);
      body+=`<div class="day-group"><div class="day-h ${ds[i]===today?'today':''}"><span>周${WD[i]}</span><span class="num">${d.getMonth()+1}/${d.getDate()}</span>${ds[i]===today?'<span class="chip acc">今天</span>':ds[i]===tmr?'<span class="chip navy">明天</span>':''}</div>`;
      body+=dl.length?dl.map(lessonRow).join(''):`<button class="row muted" data-act="slot" data-date="${ds[i]}" data-start="19:00"><span class="tm">—</span><span class="mid"><span>没有课，点这里排一节</span></span></button>`;
      body+='</div>';
    });
    return out+`<div class="panel grow col"><div class="scroll">${body}</div>${sumHtml}</div>`;
  }
  const [sH,eH]=hourRange(ws,ls),rows=eH-sH,pct=m=>((m-sH*60)/(rows*60)*100).toFixed(3)+'%';
  ui._sH=sH;ui._rows=rows;
  // 第一格的开始时间贴着顶部写，最后的结束整点不写，免得挤在一起
  let axis=`<span style="top:0;transform:none">${sH}:00</span>`;for(let h=sH+1;h<eH;h++)axis+=`<span style="top:${pct(h*60)}">${h}:00</span>`;
  let cols='';
  const nowD=new Date(),nowMin=nowD.getHours()*60+nowD.getMinutes();
  days.forEach((d,i)=>{
    const dl=ls.filter(l=>l.date===ds[i]).sort((a,b)=>toMin(a.start)-toMin(b.start)||toMin(b.end)-toMin(a.end));
    const placed=[];let cluster=[],cEnd=-1;
    const flush=()=>{const lanes=[];cluster.forEach(l=>{let k=lanes.findIndex(e=>e<=toMin(l.start));if(k<0){k=lanes.length;lanes.push(0);}lanes[k]=toMin(l.end);placed.push({l,k,cl:cluster});});cluster.lanes=lanes.length;cluster=[];};
    dl.forEach(l=>{if(cluster.length&&toMin(l.start)>=cEnd)flush();cluster.push(l);cEnd=Math.max(cEnd,toMin(l.end));});
    if(cluster.length)flush();
    const blocks=placed.map(({l,k,cl})=>{
      const n=cl.lanes||1,st=lstate(l),fx=isFixed(l);
      const flag=st==='done'||st==='free'?`<span class="flag">${ICON.check}</span>`:st==='absent'||st==='pending'?`<span class="flag">${ICON.alert}</span>`:'';
      return `<button class="lz c${cColor(l.clientId)} ${st} ${fx?'fixed':'single'}" data-act="editLesson" data-id="${l.id}" style="top:${pct(toMin(l.start))};height:calc(${(dur(l)/rows*100).toFixed(3)}% - 2px);left:calc(${k}*100%/${n});width:calc(100%/${n} - 4px)" title="${esc(cName(l.clientId))} ${l.start}–${l.end} ${esc(l.venue||'')} · ${byUnit(client(l.clientId))?nTxt(lu(l))+' 节 · ':''}${fx?'固定课':'单次课'} · ${STATE_LABEL[st]}">${flag}<b>${esc(sName(l.clientId))}</b><span class="t">${fx?ICON.loop:''}${l.start}</span>${l.venue?`<span class="v">${esc(l.venue)}</span>`:''}</button>`;
    }).join('');
    const isT=ds[i]===today,wk=i>=5;
    const now=isT&&nowMin>=sH*60&&nowMin<=eH*60?`<div class="now" style="top:${pct(nowMin)}"></div>`:'';
    cols+=`<div class="tt-col ${isT?'today':''} ${wk?'weekend':''}" data-act="slot" data-date="${ds[i]}" aria-label="周${WD[i]}，点空白处排课">${blocks}${now}</div>`;
  });

}

function viewClients(){
  const all=clientsArr(true);
  if(!all.length)return emptyStart();
  const list=all.filter(c=>(ui.showArchived||!c.archived)&&(ui.filter==='all'||c.type===ui.filter));
  const nStu=all.filter(c=>c.type==='student'&&!c.archived).length,nOrg=all.filter(c=>c.type==='org'&&!c.archived).length,nArc=all.filter(c=>c.archived).length;
  let out=`<div class="bar-row"><div class="seg" role="group" aria-label="筛选">
    <button data-act="filter" data-f="all" aria-pressed="${ui.filter==='all'}">全部</button>
    <button data-act="filter" data-f="student" aria-pressed="${ui.filter==='student'}">私教 ${nStu}</button>
    <button data-act="filter" data-f="org" aria-pressed="${ui.filter==='org'}">机构 ${nOrg}</button></div>
    <span class="sp"></span>${nArc?`<div class="seg"><button data-act="arc" aria-pressed="${ui.showArchived}" title="显示已停用的以往学员">以往 ${nArc}</button></div>`:''}</div>`;
  if(!list.length)return out+'<div class="panel empty">这个分类下还没有人。</div>';
  // 一行一个学员：左边名字和下次上课，右边余额/欠费和剩余课时；点开看详情
  out+='<div class="panel grow clist">'+list.map(c=>{
    const s=summary(c);
    const bal=s.balance<0?`<b class="neg">${c.type==='org'?'待结 ':'欠 '}${money(-s.balance)}</b>`:s.balance>0?`<b class="pos">余 ${money(s.balance)}</b>`:'<b class="muted" style="font-size:14px">已结清</b>';
    const third=s.remain!=null?`<small class="${s.remain<=1?'neg':''}">课时包剩 ${nTxt(s.remain)} 节</small>`:`<small>已上 ${nTxt(s.count)} 节</small>`;
    const fx=seriesList(c.id).filter(x=>x.up.length);
    const info=[s.next?`下次 ${mdTxt(s.next.date)} 周${wdOf(s.next.date)} ${s.next.start}`:s.lastDone?`最近一次 ${mdTxt(s.lastDone.date)}`:'暂无待上的课',
      fx.length?`固定${wdsTxt(fx[0].wds)}`:'',rateTxt(c).replace(/（.*）/,'')].filter(Boolean).join(' · ');
    return `<button class="crow c${(c.color||0)%8} ${c.archived?'arc':''}" data-act="clientDetail" data-id="${c.id}">
      <span class="ava">${esc(String(c.name).replace(/^示例·/,'').slice(0,1))}</span>
      <span class="cm"><b><span>${esc(c.name)}</span>${c.type==='org'?'<span class="chip navy">机构</span>':''}${c.archived?'<span class="chip">已停用</span>':''}</b><small>${esc(info)}</small></span>
      <span class="cr">${bal}${third}</span></button>`;}).join('')+'</div>';
  return out;
}

function viewPay(){
  if(!S.clients.size)return emptyStart();
  const cs=clientsArr(true).map(c=>({c,s:summary(c)}));
  const owe=cs.filter(x=>x.s.balance<0).sort((a,b)=>a.s.balance-b.s.balance);
  const pre=cs.filter(x=>x.s.balance>0);
  const ym=ymOf(new Date()),pm=ui.payMonth;
  const ps=payments().sort((a,b)=>b.date.localeCompare(a.date)||String(b.created||'').localeCompare(String(a.created||'')));
  const thisM=ps.filter(p=>p.date.startsWith(ym)),mPs=ps.filter(p=>p.date.startsWith(pm));
  let out=`<div class="tiles cmp t3">
    <div class="tile hl"><span>待收合计</span><b class="num">${money(-sum(owe,x=>x.s.balance))}</b><small>${owe.length} 位未结清</small></div>
    <div class="tile"><span>本月已到账</span><b class="num">${money(sum(thisM,p=>p.amount))}</b><small>${thisM.length} 笔</small></div>
    <div class="tile"><span>预收余额</span><b class="num">${money(sum(pre,x=>x.s.balance))}</b><small>预付还没上完</small></div></div>`;
  // 待收款：最多占一半高度，多了在框里滚
  out+=`<div class="panel col owe" style="max-height:45%"><div class="panel-h"><h3>待收款</h3><span class="sp"></span><span class="hint">已上课的课费 − 已收款</span></div><div class="scroll">`;
  out+=owe.length?owe.map(({c,s})=>`<div class="row c${(c.color||0)%8}"><span class="stripe"></span><span class="mid"><b>${esc(c.name)}</b><span>已上 ${nTxt(s.count)} 节 · 已收 ${money(s.paid)}</span></span>
      <span class="amt neg">${money(-s.balance)}</span><button class="btn sm primary" data-act="newPay" data-client="${c.id}" data-amount="${-s.balance}">记收款</button></div>`).join('')
    :'<div class="empty" style="padding:14px">没有待收款，账都结清了。</div>';

  // 收款记录按月翻看，不用一直往下滑
  out+=`<div class="panel grow col" style="--min-h:200px"><div class="panel-h"><h3>收款记录</h3>
      <span class="inline" style="gap:0;flex-wrap:nowrap"><button class="icon-btn" data-act="pmon" data-d="-1" aria-label="上个月">${ICON.left}</button><b style="white-space:nowrap">${ymTxt(pm)}</b><button class="icon-btn" data-act="pmon" data-d="1" aria-label="下个月">${ICON.right}</button></span>
      <span class="sp"></span>${pm!==ym?'<button class="btn sm" data-act="pmon" data-d="0">本月</button>':''}<span class="num muted" style="font-size:15px">${money(sum(mPs,x=>x.amount))}</span></div><div class="scroll">`;
  out+=mPs.length?mPs.map(p=>`<button class="row c${cColor(p.clientId)}" data-act="editPay" data-id="${p.id}"><span class="stripe"></span><span class="tm s">${mdTxt(p.date)} 周${wdOf(p.date)}</span>
      <span class="mid"><b>${esc(cName(p.clientId))}</b><span>${esc(p.method||'')}${+p.lessons>0?` · 课时包 ${p.lessons} 节`:''}${p.note?' · '+esc(p.note):''}</span></span><span class="amt">${money(p.amount)}</span></button>`).join('')
    :`<div class="empty" style="padding:16px">${ps.length?'这个月没有收款记录。':'还没有收款记录。学员付了钱或机构结算后，点下面的“记收款”。'}</div>`;
  return out+'</div></div>';

function deltaTxt(cur,prev){
  if(!prev)return '';
  const p=Math.round((cur-prev)/prev*100);
  if(Math.abs(p)>300)return '';
  return `<span class="delta ${p>=0?'up':'down'}">${p>=0?'↑':'↓'}${Math.abs(p)}%</span>`;
}
function breakdownTable(d){
  const rows=clientsArr(true).map(c=>{
    const cl=d.ch.filter(l=>l.clientId===c.id),hs=d.hs.filter(h=>h.clientId===c.id);
    return {c,n:r2(sum(cl,lu)+sum(hs,h=>h.count)),h:sum(cl,dur)+sum(hs,h=>h.hours),inc:sum(cl,l=>l.fee)+sum(hs,h=>h.fee),cost:sum(cl,l=>l.cost),his:hs.length>0};
  }).filter(r=>r.n||r.inc).sort((a,b)=>b.inc-a.inc);
  const tot=Math.max(1,d.income);
  // 占比条放在名字下面，手机上少一列、不用左右滑
  return rows.length?`<div class="tbl-wrap"><table><thead><tr><th>学员 / 机构 · 占比</th><th class="n">节数</th><th class="n">小时</th><th class="n">课酬</th><th class="n">成本</th></tr></thead><tbody>${rows.map(r=>`<tr class="c${(r.c.color||0)%8} click" data-act="clientDetail" data-id="${r.c.id}">
    <td style="white-space:normal;min-width:0"><span class="inline" style="flex-wrap:nowrap;gap:6px"><span class="dot"></span><span>${esc(sName(r.c.id))}${r.his?' <span class="chip">含补录</span>':''}</span></span><span class="share"><i style="width:${r.inc/tot*100}%"></i></span></td><td class="n">${nTxt(r.n)}</td><td class="n">${hrsTxt(r.h)}</td><td class="n">${money(r.inc)}</td><td class="n">${r.cost?money(r.cost):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">这段时间还没有上过课。</div>';
}
function barChart(months,selYm){
  const max=Math.max(1,...months.map(x=>x.pri+x.org));
  return `<div class="legend" style="padding-top:2px"><span><i class="b-pri"></i>私教</span><span><i class="b-org"></i>机构</span><span class="sp" style="flex:1"></span><span>点柱子看那个月</span></div>
    <div class="chart fill"><div class="bars">${months.map(x=>`<button class="bar ${x.k===selYm?'sel':''}" data-act="pickMonth" data-ym="${x.k}" aria-label="${ymTxt(x.k)} 课酬 ${money(x.pri+x.org)}">
      <span class="bv">${x.pri+x.org?short(x.pri+x.org):''}</span>
      <span class="stack"><i class="b-org" style="height:${x.org/max*100}%"></i><i class="b-pri" style="height:${x.pri/max*100}%"></i></span>
      <span class="bl">${+x.k.slice(5)}<em>月</em></span></button>`).join('')}</div></div>`;
}
// 统计页下半部分：图表 / 明细 / 收入来源 用分页切换，一次只占一块屏幕
function statPanel(tabs,body){
  return `<div class="panel grow col" style="--min-h:230px"><div class="panel-h" style="padding-bottom:4px"><div class="seg" role="group" aria-label="内容">${tabs.map(([k,t])=>`<button data-act="statTab" data-t="${k}" aria-pressed="${ui.statTab===k}">${t}</button>`).join('')}</div></div>
    <div class="statpane">${body}</div></div>`;
}
function viewStats(){
  if(!S.clients.size)return emptyStart();
  const yearMode=ui.statMode==='year';
  const seg=`<div class="seg" role="group" aria-label="统计周期"><button data-act="statMode" data-m="month" aria-pressed="${!yearMode}">月度</button><button data-act="statMode" data-m="year" aria-pressed="${yearMode}">年度</button></div>`;
  if(yearMode){
    if(!['chart','table','src'].includes(ui.statTab))ui.statTab='chart';
    const y=ui.year,d=periodData(String(y)),prev=periodData(String(y-1)),thisY=new Date().getFullYear();
    let out=`<div class="wk-nav"><button class="icon-btn" data-act="yr" data-d="-1" aria-label="上一年">${ICON.left}</button>
      ${y===thisY?`<div class="wk-title"><b>${y}年</b><small>今年 · 统计到今天</small></div>`:`<button class="wk-title" data-act="yr" data-d="0"><b>${y}年</b><small>点这里回到今年</small></button>`}

    out+=`<div class="tiles cmp">
      <div class="tile hl"><span>全年课酬收入</span><b class="num">${money(d.income)}</b><small>私教 ${money(d.pri)} · 机构 ${money(d.org)} ${deltaTxt(d.income,prev.income)}</small></div>
      <div class="tile"><span>全年净收入</span><b class="num">${money(d.income-d.cost)}</b><small>扣除场地等成本 ${money(d.cost)}</small></div>
      <div class="tile"><span>全年课时</span><b class="num">${hrsTxt(d.hrs)}<small> 小时</small></b><small>${nTxt(d.count)} 节 · ${d.sessions} 次${d.pend?` · 待点名 ${d.pend} 次`:''} ${deltaTxt(d.hrs,prev.hrs)}</small></div>
      <div class="tile"><span>全年到账</span><b class="num">${money(d.received)}</b><small>${prev.income?`去年课酬 ${money(prev.income)}`:'实际收到的钱'}</small></div></div>`;
    const months=[...Array(12)].map((_,i)=>`${y}-${pad(i+1)}`).map(k=>({k,...periodData(k)}));
    let body;
    if(ui.statTab==='chart')body=barChart(months,null);
    else if(ui.statTab==='src')body=breakdownTable(d);
    else{
      const mrows=months.filter(x=>x.count||x.received||x.upN);
      body=mrows.length?`<div class="tbl-wrap"><table><thead><tr><th>月份</th><th class="n">节数</th><th class="n">小时</th><th class="n">课酬</th><th class="n">成本</th><th class="n">净收入</th><th class="n">到账</th></tr></thead><tbody>
      ${mrows.map(x=>`<tr class="click" data-act="pickMonth" data-ym="${x.k}"><td>${+x.k.slice(5)}月${x.hs.length?' <span class="chip">补录</span>':''}${x.upN?` <span class="chip acc">待上 ${x.upN}</span>`:''}</td><td class="n">${nTxt(x.count)}</td><td class="n">${hrsTxt(x.hrs)}</td><td class="n">${money(x.income)}</td><td class="n">${x.cost?money(x.cost):'—'}</td><td class="n">${money(x.income-x.cost)}</td><td class="n">${money(x.received)}</td></tr>`).join('')}
      <tr class="tot"><td>合计</td><td class="n">${nTxt(d.count)}</td><td class="n">${hrsTxt(d.hrs)}</td><td class="n">${money(d.income)}</td><td class="n">${d.cost?money(d.cost):'—'}</td><td class="n">${money(d.income-d.cost)}</td><td class="n">${money(d.received)}</td></tr></tbody></table></div>`:'<div class="empty">这一年还没有记录。</div>';
    }
    return out+statPanel([['chart','每月课酬'],['table','月度明细'],['src','收入来源']],body);
  }
  if(!['chart','src','wd'].includes(ui.statTab))ui.statTab='chart';
  const ym=ui.month,d=periodData(ym),prev=periodData(addMonths(ym,-1)),thisM=ymOf(new Date());
  let out=`<div class="wk-nav"><button class="icon-btn" data-act="mon" data-d="-1" aria-label="上个月">${ICON.left}</button>
    ${ym===thisM?`<div class="wk-title"><b>${ymTxt(ym)}</b><small>本月 · 统计到今天</small></div>`:`<button class="wk-title" data-act="mon" data-d="0"><b>${ymTxt(ym)}</b><small>点这里回到本月</small></button>`}
    <button class="icon-btn" data-act="mon" data-d="1" aria-label="下个月">${ICON.right}</button><span class="sp"></span>${seg}</div>`;
  out+=`<div class="tiles cmp">
    <div class="tile hl"><span>课酬收入</span><b class="num">${money(d.income)}</b><small>私教 ${money(d.pri)} · 机构 ${money(d.org)} ${deltaTxt(d.income,prev.income)}</small></div>
    <div class="tile"><span>净收入</span><b class="num">${money(d.income-d.cost)}</b><small>扣除场地等成本 ${money(d.cost)}</small></div>
    <div class="tile"><span>已上课时</span><b class="num">${hrsTxt(d.hrs)}<small> 小时</small></b><small>${nTxt(d.count)} 节 · ${d.sessions} 次${d.pend?` · <b style="font:inherit;color:var(--warn)">待点名 ${d.pend} 次</b>`:''}${d.cancel?` · 请假/取消 ${d.cancel} 次`:''}${d.hisFee?' · 含补录':''}</small></div>
    <div class="tile"><span>本月到账</span><b class="num">${money(d.received)}</b><small>${d.upN?`还有 ${d.upN} 次课待上，约 ${money(d.upFee)}`:'实际收到的钱'}</small></div></div>`;
  let body;
  if(ui.statTab==='chart')body=barChart([...Array(12)].map((_,i)=>addMonths(ym,i-11)).map(k=>({k,...periodData(k)})),ym);
  else if(ui.statTab==='src')body=breakdownTable(d);
  else{
    const wh=[0,0,0,0,0,0,0];[...d.ch,...d.up].forEach(l=>{wh[wdIdx(l.date)]+=dur(l);});
    const wmax=Math.max(1,...wh);
    body=`<div class="wd">${wh.map((h,i)=>`<span>周${WD[i]}</span><span class="track"><i style="width:${h/wmax*100}%"></i></span><span class="num">${hrsTxt(h)} 小时</span>`).join('')}</div><div class="hint" style="padding:0 16px 10px">本月每周几的上课小时数（含待上的课）</div>`;
  }
  return out+statPanel([['chart','近 12 个月'],['src','收入来源'],['wd','每周几最忙']],body);
}

const BRAND_SVG='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4l5 15M16 3v16M23 4l-5 15M6 8c3 1 7 1.5 10 1.5S23 9 26 8"/><path d="M8 5.5L13 19h6l5-13.5"/><circle cx="16" cy="24" r="5" fill="currentColor" stroke="none"/></svg>';
let authTab='in';

      ${up?'<div class="field"><label for="a-pw2">再输一次密码</label><input id="a-pw2" type="password" autocomplete="new-password"></div>':''}
      <div id="a-err" class="errbox" hidden></div>
      <div id="a-ok" class="okbox" hidden></div>
      <button class="btn primary block" id="a-submit" type="submit">${up?'注册并登录':'登录'}</button>

function mountAuth(){
  const f=$('#a-form');if(!f)return;
  const err=$('#a-err'),ok=$('#a-ok'),btn=$('#a-submit');
  const show=(el,m)=>{err.hidden=ok.hidden=true;if(el){el.textContent=m;el.hidden=false;}};
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const email=$('#a-email').value.trim(),pw=$('#a-pw').value,up=authTab==='up';
    if(!/^\S+@\S+\.\S+$/.test(email))return show(err,'请填一个有效的邮箱');
    if(pw.length<6)return show(err,'密码至少 6 位');
    if(up&&pw!==$('#a-pw2').value)return show(err,'两次输入的密码不一样');
    btn.disabled=true;btn.textContent=up?'正在注册…':'正在登录…';show(null);
    lsSet('yuqiu-last-email',email);
    try{
      const j=up?await authPost('signup',{email,password:pw}):await authPost('token?grant_type=password',{email,password:pw});
      if(j&&j.access_token){setSession(j);enterApp();toast(up?'注册成功，欢迎使用':'已登录');return;}
      authTab='in';render();
      const o=$('#a-ok');o.textContent='注册成功。云端要求先确认邮箱：去邮箱点确认链接，再回来登录。';o.hidden=false;
    }catch(ex){
      show(err,apiMsg(ex));btn.disabled=false;btn.textContent=up?'注册并登录':'登录';
    }
  });
}
function viewSetup(){

function mountSetup(){
  const f=$('#s-form');if(!f)return;
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const url=$('#s-url').value.trim().replace(/\/+$/,''),key=$('#s-key').value.trim(),err=$('#s-err'),btn=$('#s-submit');
    err.hidden=true;
    if(!/^https:\/\/[^\s/]+$/.test(url)){err.textContent='Project URL 应该像 https://xxxx.supabase.co 这样';err.hidden=false;return;}
    if(key.length<20){err.textContent='key 看起来不完整，请整段复制';err.hidden=false;return;}
    btn.disabled=true;btn.textContent='正在检查…';
    CFG={url,key,baked:false};
    try{
      await http('GET',url+'/auth/v1/settings');
      lsSet(CFG_KEY,JSON.stringify({url,key}));store.mode='auth';render();toast('云端连接成功');
    }catch(ex){

    }
  });
}

/* ---------- sheets ---------- */
let sheetCleanup=null;
function openSheet(html,onMount,cls){
  closeSheet();
  const root=$('#sheet-root');
  root.innerHTML=`<div class="sheet-wrap"><div class="sheet ${cls||''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const wrap=root.firstElementChild;
  wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeSheet();});
  const sheet=wrap.firstElementChild;
  sheetCleanup=onMount?onMount(sheet):null;
  const f=sheet.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');
  if(f&&window.matchMedia('(min-width:860px)').matches)setTimeout(()=>{try{f.focus();}catch(e){}},30);
}
function closeSheet(){if(typeof sheetCleanup==='function')sheetCleanup();sheetCleanup=null;$('#sheet-root').innerHTML='';}
const sheetHead=t=>`<div class="sheet-h"><h2>${t}</h2><button class="icon-btn" data-act="close" aria-label="关闭">${ICON.close}</button></div>`;
function armDelete(btn,label,fn){
  if(btn.classList.contains('armed')){fn();return;}
  btn.classList.add('armed');btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent=btn.dataset.orig||'删除';}},4000);
}
const segBind=(el,attr,fn)=>{if(!el)return;el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset[attr]);}));};
const clientOptions=(sel,includeArchivedId)=>clientsArr(true).filter(c=>!c.archived||c.id===includeArchivedId).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}${c.type==='org'?'（机构）':''}</option>`).join('');
const venues=()=>[...new Set([...lessons().map(l=>l.venue),...clientsArr(true).map(c=>c.venue)].filter(Boolean))];

function genDates(startDate,wds,mode,n,until){
  const d0=parseYmd(startDate);
  const endD=mode==='weeks'?addDays(weekStart(d0),7*Math.max(1,n)-1):(until?parseYmd(until):d0);
  const out=[];
  for(let d=new Date(d0);d<=endD&&out.length<300;d=addDays(d,1))if(wds.has((d.getDay()+6)%7))out.push(ymd(d));
  return out;
}

    :`<div class="fl"><span class="lbl">类型</span><div class="seg" role="group" id="f-kind" style="display:grid;grid-template-columns:1fr 1fr">
        <button type="button" data-k="single" aria-pressed="${!startFixed}">单次课</button>
        <button type="button" data-k="fixed" aria-pressed="${startFixed}">固定课·每周循环</button></div></div>`}
    <div class="fl"><label for="f-client">学员</label><select id="f-client">${clientOptions(v.clientId,v.clientId)}</select></div>
    <div class="fl"><label for="f-date">${!l?'日期':'日期'}</label><input type="date" id="f-date" value="${v.date}"></div>

      <div class="durs sub">${[60,90,120,150].map(m=>`<button class="btn sm" type="button" data-dur="${m}">${m/60} 小时</button>`).join('')}</div></div>
    ${!l?`<div class="fixedbox" id="f-fixed" ${startFixed?'':'hidden'}>
      <div class="fl"><span class="lbl">每周</span><div class="wdpick" id="f-wds">${WD.map((w,i)=>`<button type="button" data-w="${i}" aria-pressed="${i===wdIdx(v.date)}">${w}</button>`).join('')}</div></div>
      <div class="fl"><span class="lbl">排到</span><div class="inline" style="gap:6px"><div class="seg" role="group" id="f-until-mode"><button type="button" data-u="weeks" aria-pressed="true">排几周</button><button type="button" data-u="date" aria-pressed="false">到某天</button></div>
        <span id="f-weeks-w" class="inline" style="gap:4px"><input class="inp sm" id="f-weeks" inputmode="numeric" value="12" style="width:56px"><span>周</span></span>
        <input type="date" class="inp" id="f-until" style="width:auto" hidden value="${ymd(addDays(parseYmd(v.date),7*12))}"></div></div>
      <div class="hint" id="f-preview"></div></div>`:''}
    <div class="fl"><label for="f-venue">场地</label><input id="f-venue" list="f-venues" value="${esc(v.venue)}" placeholder="例如：奥体中心 3号场"><datalist id="f-venues">${venues().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
    <div class="fl"><span class="lbl">费用</span><div class="fees">
      <span class="fi" id="f-units-w" ${byUnit(client(v.clientId))?'':'hidden'}><label for="f-units">节数</label><input id="f-units" inputmode="decimal" value="${nTxt(lu(v))}"></span>
      <span class="fi"><label for="f-fee">课费</label><input id="f-fee" inputmode="decimal" value="${v.fee}"></span>
      <span class="fi"><label for="f-cost">场地</label><input id="f-cost" inputmode="decimal" value="${v.cost||0}"></span></div>
      <div class="calc" id="f-calc"></div></div>
    <div class="field" id="f-status-w" ${rcOn?'':'hidden'}><span class="lbl">点名 <span style="font-weight:500">· ${v.date>=ROLLCALL_SINCE?'到了、缺席计费；请假、不收费不计费':'点名功能上线前的课，没点名也按“已上”计费'}</span></span><div class="seg" role="group" id="f-status">
      <button type="button" data-s="normal" aria-pressed="${!marked(v)}">还没点名</button>
      ${RC_OPTS.map(([k,t])=>`<button type="button" data-s="${k}" aria-pressed="${v.status===k}">${t}</button>`).join('')}</div></div>
    ${later.length>1?`<div class="fl"><span class="lbl">修改范围</span><div class="seg" role="group" id="f-scope" style="display:grid;grid-template-columns:1fr 1fr"><button type="button" data-sc="one" aria-pressed="true">只改这一次</button><button type="button" data-sc="after" aria-pressed="false">这次及之后 ${later.length} 次</button></div><span class="hint">“之后”只同步学员、时间、场地、节数和费用</span></div>`:''}
    <div class="fl"><label for="f-note">备注</label><textarea id="f-note" rows="1" placeholder="上课内容，例如：正手高远球、步法">${esc(v.note||'')}</textarea></div>
    <div id="f-warn" class="warnbox" hidden></div>
    <div class="actions">${l?'<button class="btn danger" id="f-del" data-orig="删除">删除</button>':''}<span class="sp"></span><button class="btn" data-act="close">取消</button><button class="btn primary" id="f-save">保存</button></div>`,
  sheet=>{
    let costTouched=!!l,status=v.status||'normal',scope='one',fixed=startFixed,untilMode='weeks',wdsTouched=false;
    const wds=new Set([wdIdx(v.date)]);
    const g=id=>sheet.querySelector('#'+id);
    const dates=()=>{
      if(l||!fixed)return [g('f-date').value].filter(Boolean);
      return genDates(g('f-date').value,wds,untilMode,parseInt(g('f-weeks').value)||1,g('f-until').value);
    };
    const preview=()=>{
      if(l||!fixed)return;
      const ds=dates();
      g('f-preview').textContent=ds.length?`将排 ${ds.length} 次课：${mdTxt(ds[0])} 起，每${wdsTxt([...wds].sort())}，到 ${ds[ds.length-1]} 为止。之后可以在学员详情里续排或提前结束。`:'没有符合的日期，请检查星期和结束时间。';
    };
    // 改了学员或时间：重新折算节数和课费；改了节数：重新算课费；直接改课费：以你填的为准
    let curUnits=lu(v);   // 精确节数（输入框里只显示 2 位小数）
    const units=()=>curUnits;
    // 节数没手动改过时按时长精确算课费（2 小时 ÷ 1.5 小时 × ¥150 = ¥200，而不是 1.33 × 150）
    const expected=(c,s,e)=>!byUnit(c)?calcFee(c,s,e):Math.abs(units()-calcUnits(c,s,e))<1e-6?calcFee(c,s,e):r2(units()*(+c.rate||0));
    const calcLine=()=>{
      const c=client(g('f-client').value),el=g('f-calc');if(!c){el.textContent='';return;}
      const s=g('f-start').value,e=g('f-end').value,h=Math.max(0,(toMin(e)-toMin(s))/60),fee=parseFloat(g('f-fee').value)||0;
      g('f-units-w').hidden=!byUnit(c);
      let t,warn=false;
      if(!byUnit(c))t=`${hrsTxt(h)} 小时 × ${money(c.rate)}/小时 = ${money(calcFee(c,s,e))}`;
      else if(unitMin(c)){const raw=h*60/unitMin(c),cu=calcUnits(c,s,e);t=`${hrsTxt(h)} 小时 ÷ 每节 ${nTxt(unitMin(c)/60)} 小时 = ${nTxt(raw)} 节${nTxt(raw)!==nTxt(cu)?`，按“${PARTIAL[c.partial]}”记 ${nTxt(cu)} 节`:''}；${nTxt(units())} 节 × ${money(c.rate)} = ${money(expected(c,s,e))}`;}
      else{t=`「${c.name}」还没填“一节课多长”，现在每次课按 1 节算。去学员资料里填上，以后排课就会按时长自动折算。`;warn=true;}
      if(Math.abs(fee-expected(c,s,e))>0.005)t+=`（课费按你填的 ${money(fee)} 记）`;
      el.textContent=t;el.classList.toggle('warn',warn);
    };
    const recalc=from=>{
      const c=client(g('f-client').value);
      if(c){
        if(from!=='units'){curUnits=calcUnits(c,g('f-start').value,g('f-end').value);g('f-units').value=nTxt(curUnits);}
        g('f-fee').value=from==='units'&&byUnit(c)?r2(units()*(+c.rate||0)):calcFee(c,g('f-start').value,g('f-end').value);
      }
      calcLine();checkWarn();
    };
    const checkWarn=()=>{
      preview();
      const s=g('f-start').value,e=g('f-end').value,w=g('f-warn');
      const msgs=[];
      if(s&&e&&toMin(e)<=toMin(s))msgs.push('结束时间要晚于开始时间');
      else if(s&&e&&status!=='cancelled'){
        const ignore=new Set(l?(scope==='after'?later.map(x=>x.id):[l.id]):[]);let hit=[];
        dates().forEach(dt=>{hit=hit.concat(conflicts(dt,s,e,ignore));});
        if(hit.length)msgs.push('时间冲突：'+hit.slice(0,3).map(x=>`${mdTxt(x.date)} ${x.start}–${x.end} ${cName(x.clientId)}`).join('；')+(hit.length>3?` 等 ${hit.length} 次`:''));
      }
      w.hidden=!msgs.length;w.textContent=msgs.join('。');
    };
    g('f-client').addEventListener('change',()=>{
      const c=client(g('f-client').value);if(!c)return;
      if(!l){g('f-end').value=fromMin(Math.min(toMin(g('f-start').value)+(+c.dur||90),23*60+55));if(c.venue)g('f-venue').value=c.venue;}
      if(!costTouched)g('f-cost').value=+c.cost||0;
      recalc();
    });
    let prevStart=g('f-start').value;
    g('f-start').addEventListener('change',()=>{const ns=g('f-start').value;if(ns&&prevStart){const d=toMin(g('f-end').value)-toMin(prevStart);if(d>0)g('f-end').value=fromMin(Math.min(toMin(ns)+d,23*60+55));}prevStart=ns;recalc();});
    g('f-end').addEventListener('change',recalc);
    g('f-date').addEventListener('change',()=>{
      if(!l&&!wdsTouched&&g('f-date').value){wds.clear();wds.add(wdIdx(g('f-date').value));g('f-wds').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',wds.has(+b.dataset.w)));}
      rcVis();
      checkWarn();
    });
    g('f-fee').addEventListener('input',calcLine);g('f-units').addEventListener('input',()=>{curUnits=parseFloat(g('f-units').value)||0;recalc('units');});
    g('f-cost').addEventListener('input',()=>costTouched=true);
    sheet.querySelectorAll('[data-dur]').forEach(b=>b.addEventListener('click',()=>{const s=toMin(g('f-start').value||'19:00');g('f-end').value=fromMin(Math.min(s+(+b.dataset.dur),23*60+55));recalc();}));
    segBind(g('f-status'),'s',x=>{status=x;checkWarn();});
    segBind(g('f-scope'),'sc',x=>{scope=x;checkWarn();});
    const rcVis=()=>{if(l)return;const on=!fixed&&g('f-date').value<=ymd(new Date());g('f-status-w').hidden=!on;if(!on&&status!=='normal'){status='normal';g('f-status').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s==='normal'));}};
    segBind(g('f-kind'),'k',x=>{fixed=x==='fixed';g('f-fixed').hidden=!fixed;rcVis();checkWarn();});
    segBind(g('f-until-mode'),'u',x=>{untilMode=x;g('f-weeks-w').hidden=x!=='weeks';g('f-until').hidden=x==='weeks';checkWarn();});
    if(g('f-wds'))g('f-wds').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.w;if(wds.has(i)){if(wds.size>1)wds.delete(i);}else wds.add(i);wdsTouched=true;
      g('f-wds').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',wds.has(+x.dataset.w)));checkWarn();}));
    ['f-weeks','f-until'].forEach(id=>{if(g(id)){g(id).addEventListener('input',checkWarn);g(id).addEventListener('change',checkWarn);}});
    calcLine();checkWarn();
    g('f-save').addEventListener('click',()=>{
      const clientId=g('f-client').value,date=g('f-date').value,start=g('f-start').value,end=g('f-end').value;
      if(!clientId||!date||!start||!end){toast('请填好学员、日期和时间');return;}
      if(toMin(end)<=toMin(start)){toast('结束时间要晚于开始时间');return;}
      const fee=r2(parseFloat(g('f-fee').value)||0),cost=r2(parseFloat(g('f-cost').value)||0);
      const un=byUnit(client(clientId))?units():1;
      const venue=g('f-venue').value.trim(),note=g('f-note').value.trim();
      ui.lastClient=clientId;
      const ops=[];
      if(!l){
        const ds=dates();if(!ds.length){toast('没有符合的日期，请检查星期和结束时间');return;}
        const sid=fixed?uid():null,now=new Date().toISOString();
        ds.forEach((dt,i)=>{const o={id:uid()+i,clientId,date:dt,start,end,venue,units:un,fee,cost,status,note,created:now};if(sid)o.seriesId=sid;ops.push(['put','lessons',o]);});
        toast(fixed?`已排好固定课 ${ds.length} 次`:'已排课');
      }else{
        const delta=Math.round((parseYmd(date)-parseYmd(l.date))/864e5);
        ops.push(['put','lessons',Object.assign({},l,{clientId,date,start,end,venue,units:un,fee,cost,status,note})]);
        if(scope==='after')later.filter(x=>x.id!==l.id).forEach(x=>ops.push(['put','lessons',Object.assign({},x,{clientId,start,end,venue,units:un,fee,cost,date:ymd(addDays(parseYmd(x.date),delta))})]));
        toast(scope==='after'?`已更新 ${later.length} 次课`:'已保存');
      }
      commit(ops);closeSheet();
    });
    if(g('f-del'))g('f-del').addEventListener('click',e=>{
      const n=scope==='after'?later.length:1;
      armDelete(e.currentTarget,n>1?`确认删除 ${n} 次课`:'确认删除',()=>{
        const ids=scope==='after'?later.map(x=>x.id):[l.id];
        commit(ids.map(i=>['del','lessons',i]));closeSheet();toast(`已删除 ${ids.length} 次课`);
      });
    });
  });
}

function openHistoryForm(opt){

function clientMonths(s){
  const m={};
  const row=k=>m[k]=m[k]||{ym:k,n:0,h:0,fee:0,paid:0,his:false,up:0};
  s.ls.forEach(l=>{const r=row(l.date.slice(0,7));if(charged(l)){r.n+=lu(l);r.h+=dur(l);r.fee+=+l.fee||0;}else if(lstate(l)==='upcoming')r.up++;});
  s.ps.forEach(p=>{row(p.date.slice(0,7)).paid+=+p.amount||0;});
  s.hs.forEach(h=>{const r=row(h.ym);r.n+=+h.count||0;r.h+=+h.hours||0;r.fee+=+h.fee||0;r.paid+=+h.paid||0;r.his=true;});
  return Object.values(m).filter(r=>r.n||r.paid||r.up).sort((a,b)=>b.ym.localeCompare(a.ym));
}

function extendSeries(sid,weeks){
  const x=seriesList().find(z=>z.sid===sid);if(!x)return;
  const ops=[],now=new Date().toISOString();
  const today=ymd(new Date());
  x.wds.forEach(w=>{
    const tpl=x.ls.filter(l=>wdIdx(l.date)===w).pop();
    let d=parseYmd(tpl.date);
    for(let i=0;i<weeks;i++){
      d=addDays(d,7);
      while(ymd(d)<today)d=addDays(d,7);
      const o=Object.assign({},tpl,{id:uid()+w+'_'+i,date:ymd(d),status:'normal',note:'',created:now});delete o.demo;
      if(tpl.demo)o.demo=true;
      ops.push(['put','lessons',o]);
    }
  });
  commit(ops);toast(`已续排 ${ops.length} 次课`);
}

/* ---------- reminders (calendar export) ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function icsFold(line){
  const enc=new TextEncoder();const out=[];let cur='',bytes=0;
  for(const ch of line){const b=enc.encode(ch).length;if(bytes+b>(out.length?74:75)){out.push(cur);cur='';bytes=0;}cur+=ch;bytes+=b;}
  out.push(cur);return out.join('\r\n ');
}
const icsUtc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function buildIcs(prefs){
  const now=new Date(),limit=addDays(now,7*prefs.weeks);
  const list=lessons().filter(l=>l.status!=='cancelled'&&lessonEndTs(l)>now.getTime()&&parseYmd(l.date)<=limit).sort(byTime);
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//yuqiu-kebiao//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:羽球课','X-WR-TIMEZONE:Asia/Shanghai'];
  const [rh,rm]=prefs.time.split(':').map(Number);
  list.forEach(l=>{
    const st=new Date(parseYmd(l.date).getTime()+toMin(l.start)*60000),en=new Date(parseYmd(l.date).getTime()+toMin(l.end)*60000);
    const remind=addDays(parseYmd(l.date),-1);remind.setHours(rh,rm,0,0);
    const before=Math.round((st-remind)/60000);
    const c=client(l.clientId)||{};
    L.push('BEGIN:VEVENT','UID:'+l.id+'@yuqiu-kebiao','DTSTAMP:'+icsUtc(now),'DTSTART:'+icsUtc(st),'DTEND:'+icsUtc(en),
      icsFold('SUMMARY:'+icsEsc(`羽毛球课 · ${c.name||''}`)));
    if(l.venue)L.push(icsFold('LOCATION:'+icsEsc(l.venue)));
    L.push(icsFold('DESCRIPTION:'+icsEsc(`${isFixed(l)?'固定课':'单次课'} · ${l.start}–${l.end}${byUnit(c)?' · '+nTxt(lu(l))+' 节':''} · 课费 ${money(l.fee)}${l.note?'\n'+l.note:''}`)));
    if(before>0)L.push('BEGIN:VALARM','ACTION:DISPLAY',icsFold('DESCRIPTION:'+icsEsc(`明天 ${l.start} 有课：${c.name||''}${l.venue?' @ '+l.venue:''}`)),`TRIGGER:-PT${before}M`,'END:VALARM');
    if(prefs.hourBefore)L.push('BEGIN:VALARM','ACTION:DISPLAY',icsFold('DESCRIPTION:'+icsEsc(`1 小时后上课：${c.name||''}`)),'TRIGGER:-PT60M','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return {text:L.join('\r\n')+'\r\n',n:list.length};
}

/* ---------- export / import ---------- */
async function saveFile(name,text,type){
  // 手机上优先用系统分享菜单（可以直接存到“文件”、发微信、或交给日历打开）
  if(isMobile()&&navigator.canShare){
    try{const f=new File([text],name,{type:type||'text/plain'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return;}}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:(type||'text/plain')+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('已导出 '+name);}
  catch(e){toast('导出没有成功，请换个浏览器试试');}
}
const csvCell=x=>{x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;};
const csv=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n');
function exportJson(){const d={app:'羽球课表',version:2,exportedAt:new Date().toISOString()};KINDS.forEach(k=>d[k]=[...S[k].values()]);saveFile(`羽球课表备份-${ymd(new Date())}.json`,JSON.stringify(d,null,1),'application/json');}
function exportLessons(){
  const rows=[['日期','星期','开始','结束','时长(小时)','节数','学员/机构','类型','课程','场地','状态','课费','成本','备注']];
  lessons().sort(byTime).forEach(l=>{const c=client(l.clientId)||{};rows.push([l.date,'周'+wdOf(l.date),l.start,l.end,hrsTxt(dur(l)),nTxt(lu(l)),c.name||'',c.type==='org'?'机构':'私教',isFixed(l)?'固定课':'单次课',l.venue||'',STATE_LABEL[lstate(l)],lstate(l)==='cancelled'?0:l.fee,l.cost||0,l.note||'']);});
  histories().sort((a,b)=>a.ym.localeCompare(b.ym)).forEach(h=>{const c=client(h.clientId)||{};rows.push([h.ym,'','','',hrsTxt(+h.hours||0),nTxt(h.count),c.name||'',c.type==='org'?'机构':'私教','补录','','补录',h.fee,0,h.note||'']);});
  saveFile(`课程明细-${ymd(new Date())}.csv`,csv(rows),'text/csv');
}
function exportPays(){
  const rows=[['日期','付款人','类型','金额','方式','课时包节数','备注']];
  payments().sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{const c=client(p.clientId)||{};rows.push([p.date,c.name||'',c.type==='org'?'机构':'私教',p.amount,p.method||'',p.lessons||'',p.note||'']);});
  saveFile(`收款记录-${ymd(new Date())}.csv`,csv(rows),'text/csv');
}
$('#import-file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.clients))throw 0;
      const ops=[];KINDS.forEach(k=>(d[k]||[]).forEach(o=>{if(o&&o.id)ops.push(['put',k,o]);}));
      commit(ops);closeSheet();toast(`已恢复 ${ops.length} 条记录`);
    }catch(err){toast('这个文件不是羽球课表的备份');}
    e.target.value='';
  };
  rd.readAsText(f);
});

    const over=pendingLessons().filter(l=>l.date<ymd(new Date()));
    armDelete(t,`确认：${over.length} 次全部记为“到了”`,()=>{commit(over.map(l=>['put','lessons',Object.assign({},l,{status:'attended'})]));toast(`已点名 ${over.length} 次课`);});
  },
  install:async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;render();},
  installNo:()=>{lsSet('yuqiu-install-no','1');render();}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const fn=A[t.dataset.act];if(fn){fn(t,e);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet-root').firstChild)closeSheet();});
let lastW=window.innerWidth;
window.addEventListener('resize',()=>{if((lastW<860)!==(window.innerWidth<860)){lastW=window.innerWidth;scheduleRender();}});
setInterval(()=>{if(!$('#sheet-root').firstChild)scheduleRender();},60000);
window.addEventListener('online',()=>{if(store.mode==='app')(store.pulled?flush():pull());});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&store.mode==='app'&&Date.now()-store.lastPull>30000)pull();});
setInterval(()=>{if(store.mode==='app'&&document.visibilityState==='visible'&&!$('#sheet-root').firstChild)pull();},180000);

function boot(){
  if(!CFG){store.mode='setup';render();return;}
  try{session=JSON.parse(lsGet(SESS_KEY)||'null');}catch(e){session=null;}
  if(session&&session.user&&session.user.id&&session.refresh_token)enterApp();
  else{session=null;store.mode='auth';render();}
}
boot();
// iPhone 的 Safari 不理会 user-scalable=no，这里直接拦掉双指缩放
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
// 发现 Netlify 标签后给页面留出底部空间
(function(){
  const check=()=>{const on=!!document.getElementById('nl-badge-frame');document.body.classList.toggle('nl-badge',on);return on;};
  if(check())return;
  const mo=new MutationObserver(()=>{if(check())mo.disconnect();});
  mo.observe(document.body,{childList:true});
  setTimeout(()=>mo.disconnect(),15000);
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
